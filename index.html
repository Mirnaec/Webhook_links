<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Almacenes Mirna</title>
    <!-- Tipografía moderna (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Colores de la marca Mirna */
            --brand-fuchsia: #e6005c;
            
            /* Colores Glassmorphism */
            --glass-bg: rgba(0, 0, 0, 0.4); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('Recursos Gráficos/Fondo-Horizontal.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            body {
                background-image: url('Recursos Gráficos/Fondo-Vertical.jpg');
            }
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        /* LOGO */
        .main-logo {
            width: 220px;
            max-width: 80%;
            height: auto;
            margin: 0 auto 25px auto;
            display: block;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
        }

        /* --- ESTILOS DE CARRUSEL --- */
        .carousel-section { display: none; margin-bottom: 25px; }
        .carousel-wrapper { position: relative; width: 100%; border-radius: 20px; overflow: hidden; border: 1px solid var(--glass-border); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .carousel-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide { min-width: 100%; scroll-snap-align: start; position: relative; }
        .carousel-slide a { display: block; width: 100%; height: 100%; text-decoration: none; cursor: pointer; }
        .carousel-slide img { width: 100%; height: auto; display: block; object-fit: cover; aspect-ratio: 2/1; }
        .carousel-hint { text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-top: 8px; font-weight: 400; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.8); color: var(--brand-fuchsia); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        .nav-btn:hover { background: #ffffff; transform: translateY(-50%) scale(1.1); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        @media (max-width: 768px) { .nav-btn { display: none; } }

        /* --- BOTONES PRINCIPALES --- */
        .link-wrapper {
            width: 100%;
            margin-bottom: 16px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            width: 100%;
            padding: 16px 22px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: #ffffff;
            font-weight: 800; 
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            text-shadow: 0px 1px 3px rgba(0,0,0,0.5); 
        }

        .link-btn > i:first-child { color: var(--brand-fuchsia); font-size: 1.25rem; width: 25px; text-align: center; }
        .link-btn > i.fa-chevron-down { color: #ffffff; font-size: 0.9rem; margin-left: auto; }
        .link-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); border-color: rgba(255, 255, 255, 0.4); }
        .link-btn:active { transform: scale(0.97); }

        .ml-btn { background: rgba(255, 224, 0, 0.1); border-color: rgba(255, 224, 0, 0.3); }
        .ml-btn > i:first-child { color: #ffd700; }
        .ml-btn:hover { background: rgba(255, 224, 0, 0.2); border-color: rgba(255, 224, 0, 0.6); }

        .magic-btn { background: rgba(230, 0, 92, 0.15); border-color: rgba(230, 0, 92, 0.4); }
        .magic-btn:hover { background: rgba(230, 0, 92, 0.25); border-color: var(--brand-fuchsia); box-shadow: 0 5px 15px rgba(230, 0, 92, 0.3); }

        /* --- SUBMENÚS --- */
        .submenu { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: rgba(0, 0, 0, 0.3); border-radius: 15px; margin-top: 5px; }
        .submenu.open { max-height: 500px; padding: 5px 0; border: 1px solid rgba(255,255,255,0.1); }
        .sub-link { display: flex; align-items: center; padding: 14px 22px; color: #ffffff; text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sub-link:last-child { border-bottom: none; }
        .sub-link:hover { background: rgba(255,255,255,0.08); padding-left: 28px; color: var(--brand-fuchsia); }
        .sub-link i { margin-right: 15px; font-size: 1.1rem; width: 20px; text-align: center; }

        @keyframes animateRipple {
            0% { width: 0; height: 0; opacity: 0.5; }
            100% { width: 400px; height: 400px; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGO -->
        <img src="Recursos Gráficos/logo.png" alt="Almacenes Mirna" class="main-logo">

        <!-- CARRUSEL -->
        <div class="carousel-section" id="carouselSection">
            <div class="carousel-wrapper">
                <button class="nav-btn prev-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="carouselTrack">
                    <!-- Dinámico -->
                </div>
                <button class="nav-btn next-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <p class="carousel-hint">Dale clic al banner para revisar más información.</p>
        </div>
        
        <!-- CONTENEDOR AGRUPADO PARA TODOS LOS BOTONES -->
        <div id="links-container">
            
            <div class="link-wrapper" data-id="ubicacion">
                <button class="link-btn" onclick="toggleMenu('menu-ubicacion')">
                    <i class="fa-solid fa-location-dot"></i> Ubicación de Agencias <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="submenu" id="menu-ubicacion">
                    <a href="https://maps.app.goo.gl/xCT6AjWg7Vf9e9iHA" target="_blank" class="sub-link"><i class="fa-solid fa-map-pin"></i> Agencia Matriz</a>
                    <a href="https://maps.app.goo.gl/Df1HuZX2CWEZweL67" target="_blank" class="sub-link"><i class="fa-solid fa-map-pin"></i> Agencia Ayacucho</a>
                    <a href="https://maps.app.goo.gl/A5B6ntJZJvuSmDmLA" target="_blank" class="sub-link"><i class="fa-solid fa-map-pin"></i> Agencia Alborada</a>
                    <a href="https://maps.app.goo.gl/CND6tMnKsKD1fdqL8" target="_blank" class="sub-link"><i class="fa-solid fa-map-pin"></i> Agencia Mall el Fortín</a>
                    <a href="https://maps.app.goo.gl/8pSDj8TZ835sBioz7" target="_blank" class="sub-link"><i class="fa-solid fa-map-pin"></i> Agencia California</a>
                    <a href="https://maps.app.goo.gl/D8iSQ7DPyjCcg5rz7" target="_blank" class="sub-link"><i class="fa-solid fa-map-pin"></i> Gran Outlet</a>
                </div>
            </div>

            <div class="link-wrapper" data-id="ventas">
                <a href="https://wa.me/593939379227" target="_blank" class="link-btn">
                    <i class="fa-brands fa-whatsapp"></i> Ventas y Asistencia
                </a>
            </div>

            <div class="link-wrapper" data-id="redes">
                <button class="link-btn" onclick="toggleMenu('menu-redes')">
                    <i class="fa-solid fa-thumbs-up"></i> Nuestras Redes Sociales <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="submenu" id="menu-redes">
                    <a href="https://www.instagram.com/almacenesmirna/" target="_blank" class="sub-link"><i class="fa-brands fa-instagram"></i> Instagram</a>
                    <a href="https://www.tiktok.com/@almacenesmirna.ec" target="_blank" class="sub-link"><i class="fa-brands fa-tiktok"></i> TikTok</a>
                    <a href="https://www.facebook.com/almacenesmirna" target="_blank" class="sub-link"><i class="fa-brands fa-facebook"></i> Facebook</a>
                </div>
            </div>

            <div class="link-wrapper" data-id="web">
                <a href="https://www.almacenesmirna.com.ec/" target="_blank" class="link-btn">
                    <i class="fa-solid fa-globe"></i> Visita nuestra Web
                </a>
            </div>

            <div class="link-wrapper" data-id="mercadolibre">
                <a href="https://tienda.mercadolibre.com.ec/almacenes-mirna" target="_blank" class="link-btn ml-btn">
                    <i class="fa-solid fa-handshake"></i> Compra por Mercado Libre
                </a>
            </div>

            <!-- Los botones mágicos dinámicos de Sheets también se inyectarán dentro de este contenedor -->
        </div>

    </div>

    <script>
        // --- 1. SUBMENÚS ---
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            document.querySelectorAll('.submenu').forEach(el => {
                if(el.id !== menuId) el.classList.remove('open');
            });
            menu.classList.toggle('open');
        }

        // --- 2. URLS DE TUS HOJAS DE CÁLCULO ---
        // Tu hoja actual con el contenido (Carrusel y Botones mágicos)
        const googleSheetDataUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdWWnx0hulqzaoFG7601i6k_9dIrTkINeJ5g7ofkDPKKzfVmFX6DVc2RwrY3CPx-CSy3tzmMON8eVP/pub?gid=0&single=true&output=csv'; 
        
        // Tu NUEVA hoja con el Orden de los botones
        const googleSheetOrdenUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdWWnx0hulqzaoFG7601i6k_9dIrTkINeJ5g7ofkDPKKzfVmFX6DVc2RwrY3CPx-CSy3tzmMON8eVP/pub?gid=1627002415&single=true&output=csv'; 

        async function fetchGoogleData() {
            try {
                // --- A. PRIMERO CARGAMOS LOS DATOS Y CREAMOS LOS BOTONES DINÁMICOS ---
                const responseData = await fetch(googleSheetDataUrl);
                const textData = await responseData.text();
                const rowsData = textData.split('\n').slice(1); 
                
                const track = document.getElementById('carouselTrack');
                const carouselSection = document.getElementById('carouselSection');
                const linksContainer = document.getElementById('links-container'); 
                
                let hasImages = false;
                let btnCounter = 1; 

                rowsData.forEach(row => {
                    if(!row.trim()) return;
                    const cols = row.split(',');
                    if(cols.length < 2) return;

                    const idType = cols[0].trim().replace(/^"|"$/g, ''); 
                    const contentValue = cols[1].trim().replace(/^"|"$/g, ''); 
                    const redirectUrl = cols.length >= 4 ? cols[3].trim().replace(/^"|"$/g, '') : '';

                    // Carrusel
                    if(idType.toLowerCase() === 'carrusel' && contentValue.startsWith('http')) {
                        hasImages = true;
                        const slide = document.createElement('div');
                        slide.className = 'carousel-slide';
                        let slideHTML = `<img src="${contentValue}" alt="Banner Promocional">`;
                        if (redirectUrl && redirectUrl.startsWith('http')) {
                            slideHTML = `<a href="${redirectUrl}" target="_blank">${slideHTML}</a>`;
                        }
                        slide.innerHTML = slideHTML;
                        track.appendChild(slide);
                    }
                    
                    // Botón Mágico Dinámico
                    if(idType.toLowerCase() === 'botón único' || idType.toLowerCase() === 'boton unico') {
                        if(contentValue && redirectUrl.startsWith('http')) {
                            const newWrapper = document.createElement('div');
                            newWrapper.className = 'link-wrapper';
                            // Asignamos el ID dinámico: dinamico-1, dinamico-2, etc.
                            newWrapper.setAttribute('data-id', 'dinamico-' + btnCounter); 
                            btnCounter++;
                            
                            newWrapper.innerHTML = `
                                <a href="${redirectUrl}" target="_blank" class="link-btn magic-btn">
                                    <i class="fa-solid fa-star"></i> ${contentValue}
                                </a>
                            `;
                            linksContainer.appendChild(newWrapper);
                            addRippleEffect(newWrapper.querySelector('.link-btn'));
                        }
                    }
                });

                if(hasImages) {
                    carouselSection.style.display = 'block';
                    setupCarouselControls(track);
                }

                // --- B. LUEGO CARGAMOS EL ORDEN Y REORGANIZAMOS LOS BOTONES ---
                const responseOrden = await fetch(googleSheetOrdenUrl);
                const textOrden = await responseOrden.text();
                // Omitimos la fila de encabezados
                const rowsOrden = textOrden.split('\n').slice(1); 
                
                rowsOrden.forEach(row => {
                    if(!row.trim()) return;
                    const cols = row.split(',');
                    // Tomamos el valor de la Columna A y limpiamos comillas por si acaso
                    const idBotonDeseado = cols[0].trim().replace(/^"|"$/g, ''); 
                    
                    // Buscamos si ese botón existe en el HTML
                    const elemento = document.querySelector(`[data-id="${idBotonDeseado}"]`);
                    if(elemento) {
                        // Lo mandamos al final de la lista. 
                        // Como esto se ejecuta fila por fila de arriba a abajo, 
                        // el orden final queda idéntico al de tu Sheet.
                        linksContainer.appendChild(elemento);
                    }
                });

            } catch (error) {
                console.error('Error al cargar datos desde Google Sheets:', error);
            }
        }

        // --- CONTROLES CARRUSEL ---
        function setupCarouselControls(track) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const goNext = () => { track.scrollLeft + track.clientWidth >= track.scrollWidth - 5 ? track.scrollTo({ left: 0, behavior: 'smooth' }) : track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }); };
            const goPrev = () => { track.scrollLeft <= 0 ? track.scrollTo({ left: track.scrollWidth, behavior: 'smooth' }) : track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }); };
            nextBtn.addEventListener('click', goNext);
            prevBtn.addEventListener('click', goPrev);
            let autoLoop = setInterval(goNext, 4000);
            track.addEventListener('touchstart', () => clearInterval(autoLoop));
            track.addEventListener('mouseenter', () => clearInterval(autoLoop));
            track.addEventListener('touchend', () => { clearInterval(autoLoop); autoLoop = setInterval(goNext, 4000); });
            track.addEventListener('mouseleave', () => { clearInterval(autoLoop); autoLoop = setInterval(goNext, 4000); });
        }

        // --- EFECTO RIPPLE ---
        function addRippleEffect(element) {
            element.addEventListener('mousedown', function(e) {
                let ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.background = 'rgba(255, 255, 255, 0.4)';
                ripple.style.borderRadius = '50%';
                ripple.style.pointerEvents = 'none';
                ripple.style.width = '100px';
                ripple.style.height = '100px';
                ripple.style.transform = 'translate(-50%, -50%)';
                ripple.style.animation = 'animateRipple 0.6s linear';
                let rect = this.getBoundingClientRect();
                ripple.style.left = `${e.clientX - rect.left}px`;
                ripple.style.top = `${e.clientY - rect.top}px`;
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        }
        document.querySelectorAll('.link-btn').forEach(btn => addRippleEffect(btn));

        // Iniciar la carga
        fetchGoogleData();
    </script>
</body>
</html>
